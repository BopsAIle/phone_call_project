[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-call-project"
version = "0.1.0"
description = "Vietnamese restaurant phone booking voice agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "openai>=1.50.0",
]

[project.optional-dependencies]
chroma = [
  "chromadb>=0.5.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]
all = [
  "phone-call-project[chroma,dev]",
]

[tool.setuptools.packages.find]
include = ["apps*", "shared*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
